<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyan/Blue X Beam Gradient 1 -->
    <linearGradient id="x-beam-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glowing Cyan/Purple X Beam Gradient 2 -->
    <linearGradient id="x-beam-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#ring-grad)" stroke-width="4" stroke-opacity="0.4" fill="none" />

  <!-- Outer Tech Scanner Circle -->
  <circle cx="256" cy="256" r="180" stroke="url(#ring-grad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.7" />
  <circle cx="256" cy="256" r="210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 20" opacity="0.4" />

  <!-- Crosshair Target Marks -->
  <path d="M256 56 V80 M256 432 V456 M56 256 H80 M432 256 H456" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Core Center Glow -->
  <circle cx="256" cy="256" r="120" fill="url(#core-glow)" filter="url(#glow)" opacity="0.8" />

  <!-- Stylized "X" - X-Ray Beam 1 (Diagonal 1) -->
  <path d="M140 140 L372 372" stroke="url(#x-beam-1)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
  <path d="M140 140 L372 372" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Stylized "X" - X-Ray Beam 2 (Diagonal 2) -->
  <path d="M372 140 L140 372" stroke="url(#x-beam-2)" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />
  <path d="M372 140 L140 372" stroke="#e0f2fe" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Center Focal Eye / Aperture Ring -->
  <circle cx="256" cy="256" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="252" cy="252" r="4" fill="#ffffff" />

  <!-- Horizontal Grid Rays -->
  <path d="M120 256 H392" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 8" opacity="0.5" />
  <path d="M256 120 V392" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 8" opacity="0.5" />
</svg>